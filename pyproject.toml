[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "lgpowercontrol"
description = "Links an LG WebOS TV's power state to a computer's power state"
readme = "README.md"
requires-python = ">=3.10"
dynamic = ["version"]
dependencies = [
    "bscpylgtv",
    "websockets",
]

[project.scripts]
lgpowercontrol = "lgpowercontrol.cli:main"
lgpowercontrol-monitor = "lgpowercontrol.monitor:main"
lgpowercontrol-notify = "lgpowercontrol.notify:main"
lgpowercontrol-update-check = "lgpowercontrol.update:check_main"
lgpowercontrol-sleep-listener = "lgpowercontrol.suspend:listener"
lgpowercontrol-sleep-hook = "lgpowercontrol.suspend:hook"
lgpowercontrol-nm-dispatcher = "lgpowercontrol.suspend:dispatcher"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.dynamic]
version = {file = "VERSION"}
