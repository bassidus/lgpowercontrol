line-length = 120

[lint]
# Default rule set (pyflakes + a pycodestyle subset) only. Excluded on purpose:
# - PLW1510 (subprocess.run without explicit check=) - most calls here are
#   deliberately best-effort (systemctl/busctl calls whose failure is fine to
#   ignore), matching the `|| true` style of the bash scripts they replaced.
# - EXE001 (shebang present but file not executable) - false positive for
#   library modules like lgtvpc_common.py that are only ever imported, not run.
select = ["E4", "E7", "E9", "F"]
