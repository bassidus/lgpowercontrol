# LGPowerControl configuration. Installed as /opt/lgpowercontrol/lgpowercontrol.conf.
# After editing, restart what is running:
#   sudo systemctl restart lgpowercontrol-monitor.service
#   systemctl --user restart lgpowercontrol-notify.service

LGTV_IP=""
# Required. The TV's address, e.g. "192.168.1.100".

LGTV_MAC=""
# Filled in by the installer, while the TV is on.

# --- The TV's input, and when the TV may be turned off ------------------------------

HDMI_INPUT=""
# The input this computer is connected to, e.g. "2". The TV is switched to it when this
# computer turns the TV on. Empty = never switch.

SHARED_TV="0" # 1 = enabled | 0 = disabled
# Another device, e.g. a game console, uses the same TV. The TV is then only turned off
# while it is showing the input above, and one that is already on keeps its picture when
# this computer wakes. Needs HDMI_INPUT.

POWER_OFF_AT_SUSPEND="1" # 1 = enabled | 0 = disabled
# Turn the TV off when this computer suspends.

POWER_OFF_AT_SHUTDOWN="1" # 1 = enabled | 0 = disabled
# Turn the TV off when this computer shuts down.

# --- Idle warning (Plasma only) -----------------------------------------------------
# A notification warns you before idling turns the TV off. Needs "Dim automatically"
# enabled in system settings - the dim is what starts the countdown.

OFF_WARNING_SECONDS="120" # seconds, 0 = disabled
# How far ahead of the TV turning off the warning comes. More than the gap between
# dimming and screen-off means it comes as soon as the screen dims.

NOTIFY_POLL_SECONDS="5" # seconds
# How often the service checks whether the screen has dimmed. A lower value uses more
# CPU, but lands the warning closer to the configured time.

LOGGING="0" # 1 = enabled | 0 = disabled
# Run journalctl -t lgpowercontrol to see the log messages.
