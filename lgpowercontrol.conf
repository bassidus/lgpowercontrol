# LGPowerControl configuration file
# Lives at /opt/lgpowercontrol/lgpowercontrol.conf after install.

# Required:

LGTV_IP=""
# TV's IP, e.g. "192.168.1.100". Use a static IP/DHCP reservation.

# Optional:

LGTV_MAC=""
# TV's MAC address. Auto-detected by the installer if the TV is on.

HDMI_INPUT=""
# Input to switch to on turn-on, e.g. "1", "2", "3" and so on. Empty = Don't switch.

POWER_OFF_ONLY_ON_HDMI=""
# Set this when the TV is shared with another source, such as a work laptop on
# another HDMI input. The value is this computer's own input, e.g. "2" for HDMI 2.
# The TV is then only turned off while it is showing this computer, and the input
# is never switched when the computer wakes, so the other source is left alone.
# Overrides HDMI_INPUT. Empty = off (default).

OFF_WARNING_SECONDS="120"
# When you leave the computer idle, Plasma first dims the screen, then turns it off
# a while later - and that screen-off is what turns the TV off. A desktop notification
# warns you this many seconds before it happens, so you can move the mouse in time.
# 0 = no warning. Longer than the gap between dim and off = the warning appears
# as soon as the screen dims.
# Needs Plasma's "Dim automatically" enabled - the dim is what starts the countdown.

NOTIFY_POLL_SECONDS="5"
# Plasma does not announce the dim anywhere, so the notify service has to ask
# kscreen-doctor about it this often, around the clock. Each check is a short-lived
# process; a low value makes the warning land closer to the intended time but keeps
# waking the CPU. 5 is a reasonable balance, 1-2 only if you want it exact.

LOGGING="on"
# Log to the system journal. View with: journalctl -t lgpowercontrol

# After editing, restart if running:
# sudo systemctl restart lgpowercontrol-monitor.service
# systemctl --user restart lgpowercontrol-notify.service
