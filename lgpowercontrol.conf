# LGPowerControl configuration file
# Lives at /opt/lgpowercontrol/lgpowercontrol.conf after install.

# Required:

LGTV_IP=""
# TV's IP, e.g. "192.168.1.100". Use a static IP/DHCP reservation.

# Optional:

LGTV_MAC=""
# TV's MAC address. Auto-detected by the installer if the TV is on.

HDMI_INPUT=""
# Input to switch to on turn-on, e.g. "1" or "2". Empty = Don't switch.

REQUIRED_APP=""
# Only send screen-off / power-off when the TV is showing this app (input).
# Find yours with: lgpowercontrol-authorize, then bscpylgtvcommand -p /opt/lgpowercontrol/.aiopylgtv.sqlite <IP> get_current_app
# Example: "com.webos.app.hdmi2".  Empty = always send commands (current behavior).

OFF_WARNING_SECONDS="120"
# Notify this many seconds before screen/TV turn off. 0 = disable.
# Needs Plasma's "Dim automatically" enabled.

NOTIFY_POLL_SECONDS="2"
# How often notify checks Plasma's dim state. Lower = snappier, more CPU.

UPDATE_CHECK_DAYS="7"
# Check GitHub for updates at most this often. 0 = disable.

UPDATE_CHANNEL="main"
# "main" (stable releases) or "dev" (latest commit).

LOGGING="on"
# Log to the system journal. View with: journalctl -t lgpowercontrol

# After editing, restart if running:
# sudo systemctl restart lgpowercontrol-monitor.service
# systemctl --user restart lgpowercontrol-notify.service
