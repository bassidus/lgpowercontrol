name: ci

on:
  push:
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: python syntax
        run: |
          python3 -m py_compile \
            install.py uninstall.py lgtvpc_common.py \
            scripts/authorize.py \
            scripts/lgtvpc \
            scripts/monitor.py \
            scripts/notify.py \
            scripts/90-lgtvpc \
            scripts/sleep.py \
            scripts/update.py \
            scripts/update-check.py
      - name: ruff
        run: |
          pip install --quiet ruff
          ruff check .
