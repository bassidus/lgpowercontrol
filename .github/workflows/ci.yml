name: ci

on:
  push:
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: python syntax
        run: |
          python3 -m py_compile install.py uninstall.py legacy_migration.py src/lgpowercontrol/*.py
      - name: ruff
        run: |
          pip install --quiet ruff
          ruff check .
